<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Artés Espai Creatiu">
<title>Artés Espai Creatiu</title>
<!--
  La rueda de color de la portada, con la «a» del logotipo dentro.

  Antes esto era la «a» sola sobre el círculo de arena: se leía, pero en dos
  colores apagados y sin nada que la distinguiera de cualquier otra pestaña. La
  rueda mete los cuatro colores de la lámina del cliente, que a 16 px es lo
  único que de verdad se reconoce: la forma se pierde, el color no.

  La insignia entera no vale de favicon —los seis caracteres de «art-és» a 16 px
  son una mancha—, y por eso va solo la «a».
-->
<circle cx="50" cy="50" r="46" fill="#f9f5d7"/>
  <path d="M 43.23 11.59 A 39.0 39.0 0 0 1 84.43 31.69" stroke="#e5b132" stroke-width="13.0" fill="none"/>
